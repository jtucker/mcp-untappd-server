# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - clientId
      - clientSecret
    properties:
      clientId:
        type: string
        description: Untappd API client ID
      clientSecret:
        type: string
        description: Untappd API client secret
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: { CLIENT_ID: config.clientId, CLIENT_SECRET: config.clientSecret } })
  exampleConfig:
    clientId: YOUR_UNTAPPD_CLIENT_ID
    clientSecret: YOUR_UNTAPPD_CLIENT_SECRET
